version: "3.8"

networks:
  reverse-proxy:
    external: true
  litellm:
    external: true

services:
  main:
    image: ghcr.io/open-webui/open-webui:0.11.3
    networks:
      - reverse-proxy
      - litellm
    deploy:
      labels:
        - "traefik.enable=true"
        # ── Main router: forward auth for browser SSO ──
        - "traefik.http.routers.openwebui.rule=Host(`openwebui.actuary.dev`)"
        - "traefik.http.routers.openwebui.entrypoints=websecure"
        - "traefik.http.routers.openwebui.service=openwebui"
        - "traefik.http.routers.openwebui.tls.certresolver=myresolver"
        - "traefik.http.routers.openwebui.middlewares=authentik@file"
        # ── API bypass router: app/API key auth, NO forward auth ──
        # Matches requests that already carry an Authorization header,
        # so they skip the Authentik middleware and go straight to OpenWebUI
        - "traefik.http.routers.openwebui-api.rule=Host(`openwebui.actuary.dev`) && HeadersRegexp(`Authorization`, `.+`)"
        - "traefik.http.routers.openwebui-api.entrypoints=websecure"
        - "traefik.http.routers.openwebui-api.service=openwebui"
        - "traefik.http.routers.openwebui-api.tls.certresolver=myresolver"
        # Note: NO middlewares on openwebui-api — requests go directly to OpenWebUI
        - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm_main:4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBUI_URL=https://openwebui.actuary.dev
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-authentik-email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-authentik-name
      - WEBUI_AUTH_TRUSTED_USERNAME_HEADER=X-authentik-username
      - ENABLE_PERSISTENT_CONFIG=false
      - ENABLE_LOGIN_FORM=true
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - JWT_EXPIRES_IN=72h
      - WEBUI_AUTH_COOKIE_SECURE=true
      # ── Authentik OIDC (for app OAuth flow) ──
      # Browsers get SSO via forward auth middleware — they never see this.
      # Apps that bypass forward auth hit OpenWebUI directly and can use
      # either API keys or the OIDC flow through Authentik.
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://authentik.actuary.dev/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_SCOPES=openid email profile
      - OAUTH_CODE_CHALLENGE_METHOD=S256
      # Web Search Configuration
      - ENABLE_WEB_SEARCH=True
      - ENABLE_WEB_SEARCH_CONFIRMATION=True
      # Brave
      - WEB_SEARCH_ENGINE=brave
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - BRAVE_SEARCH_CONTEXT_TOKENS=8192
      - WEB_SEARCH_CONCURRENT_REQUESTS=1
      # SearXNG
      #- WEB_SEARCH_ENGINE=searxng
      #- WEB_SEARCH_RESULT_COUNT=3
      #- WEB_SEARCH_CONCURRENT_REQUESTS=10
      #- SEARXNG_QUERY_URL=http://searxng_main:8080/search?q=<query>
    volumes:
      - /mnt/user/docker/volumes/open-webui:/app/backend/data

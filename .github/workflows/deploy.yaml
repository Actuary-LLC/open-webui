name: Deploy Open WebUI

on:
  push:
    branches: [main]
    paths:
      - "open-webui.yaml"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

env:
  STACK_NAME: openwebui
  SERVICE_NAME: openwebui_main
  OPENAI_API_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
  WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
  BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
  # OIDC SSO (Authentik) — required for the sign-in page to render an SSO button.
  # Names match the pre-existing GitHub variable/secret from earlier deploy.yaml revisions.
  OAUTH_CLIENT_ID: ${{ vars.AUTHENTIK_OAUTH_CLIENT_ID }}
  OAUTH_CLIENT_SECRET: ${{ secrets.AUTHENTIK_OAUTH_CLIENT_SECRET }}
jobs:
  deploy:
    runs-on: coral
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required OIDC credentials
        run: |
          ok=1
          [ -n "$OAUTH_CLIENT_ID" ] || { echo "❌ vars.AUTHENTIK_OAUTH_CLIENT_ID is empty — add it as a repository variable."; ok=0; }
          [ -n "$OAUTH_CLIENT_SECRET" ] || { echo "❌ secrets.AUTHENTIK_OAUTH_CLIENT_SECRET is empty — add it as a repository secret."; ok=0; }
          [ "$ok" = 1 ] || { echo "Without these Open WebUI registers no SSO provider and the login page has no button."; exit 1; }

      - name: Deploy stack
        run: |
          docker stack deploy \
            -c open-webui.yaml \
            "$STACK_NAME"

      - name: Wait for convergence
        run: |
          for i in $(seq 1 30); do
            REPLICAS=$(docker service ls \
              --filter "name=${SERVICE_NAME}" \
              --format "{{.Replicas}}")
            [ "$REPLICAS" = "1/1" ] && echo "✅ Done" && exit 0
            echo "Waiting... ($i/30) — $REPLICAS"
            if [ "$i" -eq 5 ] || [ $((i % 10)) -eq 0 ]; then
              docker service ps "${STACK_NAME}_${SERVICE_NAME}" --no-trunc --filter "desired-state=running" 2>/dev/null || true
              docker service logs --tail 30 "${STACK_NAME}_${SERVICE_NAME}" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "--- Final logs ---"
          docker service logs --tail 50 "${STACK_NAME}_${SERVICE_NAME}" 2>/dev/null || true
          docker service rollback "${STACK_NAME}_${SERVICE_NAME}"
          exit 1
